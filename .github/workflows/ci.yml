name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      UV_LOCKED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/tiktoken
          key: tiktoken-cl100k_base
      - run: uv sync
      - run: make check

  reranker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UV_LOCKED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/tiktoken
          key: tiktoken-cl100k_base
      - id: pin
        run: |
          {
            echo "model=$(sed -n 's|^RERANKER_MODEL=||p' .env.example | tr / _)"
            echo "revision=$(sed -n 's|^RERANKER_REVISION=||p' .env.example)"
            echo "digest=$(grep -o 'text-embeddings-inference:[^ ]*' docker-compose.yml | sed 's|.*sha256:||')"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/tei
          key: tei-${{ steps.pin.outputs.model }}-${{ steps.pin.outputs.revision }}-${{ steps.pin.outputs.digest }}
      - run: uv sync
      - run: make test-reranker
