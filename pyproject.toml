[project]
name = "rag-anatomy"
version = "0.1.0"
description = "Retrieval-augmented generation built from first principles, with every choice measured."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.uv]
required-version = "==0.9.26"

[tool.ruff.lint]
select = ["F", "E4", "E7", "E9", "I", "UP", "B", "RUF", "TID", "ERA"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"unittest.mock".msg = "Use a hand-written fake from tests/fakes/."
"abc.ABC".msg = "Use typing.Protocol."

[tool.mypy]
strict = true
files = ["src", "tests"]
warn_unreachable = true
enable_error_code = ["ignore-without-code"]

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
strict = true

[tool.coverage.run]
source_pkgs = ["rag_anatomy"]
branch = true
