[project]
name = "rag-anatomy"
version = "0.1.0"
description = "Retrieval-augmented generation built from first principles, with every choice measured."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "pgvector>=0.5.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.1",
    "tiktoken>=0.14.0",
]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
    "testcontainers>=4.15.0",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.uv]
required-version = "==0.9.26"

[tool.alembic]
script_location = "rag_anatomy.adapters.driven.postgres:migrations"

[tool.ruff.lint]
select = ["F", "E4", "E7", "E9", "I", "UP", "B", "RUF", "TID", "ERA"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"unittest.mock".msg = "Use a hand-written fake from tests/fakes/."
"abc.ABC".msg = "Use typing.Protocol."

[tool.mypy]
strict = true
files = ["src", "tests"]
warn_unreachable = true
enable_error_code = ["ignore-without-code"]
plugins = ["pydantic.mypy"]

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
strict = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs Docker (testcontainers)"]

[tool.importlinter]
root_package = "rag_anatomy"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Dependencies point inward"
type = "layers"
layers = [
    "rag_anatomy.adapters",
    "rag_anatomy.services",
    "rag_anatomy.ports",
    "rag_anatomy.domain",
]

[[tool.importlinter.contracts]]
name = "Driving and driven adapters meet only through the core"
type = "independence"
modules = ["rag_anatomy.adapters.driving", "rag_anatomy.adapters.driven"]

[[tool.importlinter.contracts]]
name = "The core imports no SDKs"
type = "forbidden"
source_modules = ["rag_anatomy.domain", "rag_anatomy.ports", "rag_anatomy.services"]
forbidden_modules = [
    "openai",
    "psycopg",
    "psycopg_pool",
    "pgvector",
    "fastapi",
    "starlette",
    "httpx",
    "pydantic",
    "pydantic_settings",
    "dotenv",
    "alembic",
    "sqlalchemy",
    "testcontainers",
    "pypdf",
    "tiktoken",
]

[tool.coverage.run]
source_pkgs = ["rag_anatomy"]
branch = true
